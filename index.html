<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title id="doc-title">Detail Gold | Limpieza y Estética Automotriz</title>

    <!-- FontAwesome Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Google Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Supabase JS Client v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
      :root {
        --primary-gold: #d4af37;
        --secondary-gold: #aa7c11;
        --light-gold: #f3e5ab;
        --dark-bg: #121212;
        --card-bg: #1e1e1e;
        --text-main: #f5f5f5;
        --text-muted: #a0a0a0;
        --white: #ffffff;
        --border-gold: rgba(212, 175, 55, 0.3);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Montserrat', sans-serif;
      }

      body {
        background-color: var(--dark-bg);
        color: var(--text-main);
        line-height: 1.6;
      }

      header {
        background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
        border-bottom: 2px solid var(--primary-gold);
        padding: 2rem 1rem;
        text-align: center;
        position: relative;
      }

      .brand-title {
        font-family: 'Playfair Display', serif;
        font-size: 2.8rem;
        color: var(--primary-gold);
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 0.5rem;
      }

      .brand-subtitle {
        color: var(--text-muted);
        font-size: 1.1rem;
        font-weight: 300;
      }

      .admin-btn {
        position: absolute;
        top: 1rem;
        right: 1rem;
        background: transparent;
        border: 1px solid var(--border-gold);
        color: var(--primary-gold);
        padding: 0.5rem 1rem;
        border-radius: 20px;
        cursor: pointer;
        transition: all 0.3s ease;
        z-index: 10;
      }

      .admin-btn:hover {
        background: var(--primary-gold);
        color: #000;
      }

      .container {
        max-width: 1200px;
        margin: 2rem auto;
        padding: 0 1rem;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2rem;
      }

      .search-bar {
        flex: 1;
        min-width: 280px;
        position: relative;
      }

      .search-bar input {
        width: 100%;
        padding: 0.8rem 1rem 0.8rem 2.5rem;
        background: var(--card-bg);
        border: 1px solid var(--border-gold);
        border-radius: 8px;
        color: var(--text-main);
      }

      .search-bar i {
        position: absolute;
        left: 1rem;
        top: 50%;
        transform: translateY(-50%);
        color: var(--primary-gold);
      }

      .filter-tags {
        display: flex;
        gap: 0.5rem;
        overflow-x: auto;
        padding-bottom: 0.5rem;
      }

      .tag-btn {
        background: var(--card-bg);
        border: 1px solid var(--border-gold);
        color: var(--text-main);
        padding: 0.5rem 1rem;
        border-radius: 20px;
        cursor: pointer;
        white-space: nowrap;
      }

      .tag-btn.active {
        background: var(--primary-gold);
        color: #000;
        font-weight: 600;
      }

      .products-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
        gap: 1.5rem;
      }

      .product-card {
        background: var(--card-bg);
        border: 1px solid var(--border-gold);
        border-radius: 12px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        transition: transform 0.3s ease;
      }

      .product-card:hover {
        transform: translateY(-5px);
      }

      .product-img {
        width: 100%;
        height: 200px;
        object-fit: cover;
      }

      .product-info {
        padding: 1.2rem;
        display: flex;
        flex-direction: column;
        flex: 1;
      }

      .product-title {
        font-size: 1.2rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
        color: var(--white);
      }

      .product-desc {
        color: var(--text-muted);
        font-size: 0.9rem;
        margin-bottom: 1rem;
        flex: 1;
      }

      .product-price {
        font-size: 1.4rem;
        font-weight: 700;
        color: var(--primary-gold);
        margin-bottom: 1rem;
      }

      .buy-btn {
        width: 100%;
        background: #25d366;
        color: white;
        border: none;
        padding: 0.8rem;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        text-decoration: none;
      }

      /* Modales */
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.85);
        justify-content: center;
        align-items: center;
        z-index: 1000;
        padding: 1rem;
      }

      .modal.active {
        display: flex;
      }

      .modal-content {
        background: var(--card-bg);
        border: 1px solid var(--primary-gold);
        padding: 2rem;
        border-radius: 12px;
        max-width: 500px;
        width: 100%;
        max-height: 90vh;
        overflow-y: auto;
        position: relative;
      }

      .close-btn {
        position: absolute;
        top: 1rem;
        right: 1rem;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 1.8rem;
      }

      .form-group {
        margin-bottom: 1.2rem;
      }

      .form-group label {
        display: block;
        margin-bottom: 0.4rem;
        color: var(--primary-gold);
      }

      .form-group input,
      .form-group textarea,
      .form-group select {
        width: 100%;
        padding: 0.8rem;
        background: #121212;
        border: 1px solid var(--border-gold);
        color: white;
        border-radius: 6px;
      }

      .submit-btn {
        width: 100%;
        background: var(--primary-gold);
        color: black;
        font-weight: bold;
        padding: 0.8rem;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }

      footer {
        text-align: center;
        padding: 2rem;
        margin-top: 3rem;
        border-top: 1px solid var(--border-gold);
        color: var(--text-muted);
      }

      footer a {
        color: var(--primary-gold);
        text-decoration: none;
        margin: 0 0.5rem;
      }
    </style>
  </head>
  <body>
    <header>
      <button class="admin-btn" id="btn-admin-modal">
        <i class="fa-solid fa-gear"></i> Panel Admin
      </button>
      <h1 class="brand-title" id="store-title">Detail Gold</h1>
      <p class="brand-subtitle" id="store-subtitle">
        Limpieza y Estética Automotriz
      </p>
    </header>

    <div class="container">
      <div class="controls">
        <div class="search-bar">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input
            type="text"
            id="search-input"
            placeholder="Buscar productos..."
          />
        </div>
        <div class="filter-tags" id="category-filters">
          <button class="tag-btn active" data-cat="Todos">Todos</button>
          <button class="tag-btn" data-cat="Autos">Autos</button>
          <button class="tag-btn" data-cat="Jabones">Jabones</button>
          <button class="tag-btn" data-cat="Limpieza">Limpieza</button>
        </div>
      </div>

      <div class="products-grid" id="products-container">
        <!-- Se cargan dinámicamente -->
      </div>
    </div>

    <footer>
      <p>
        &copy; <span id="year"></span>
        <span id="footer-title">Detail Gold</span>. Todos los derechos
        reservados.
      </p>
      <p style="margin-top: 0.5rem">
        <a id="link-instagram" href="#" target="_blank"
          ><i class="fa-brands fa-instagram"></i> Instagram</a
        >
        |
        <a id="link-whatsapp" href="#" target="_blank"
          ><i class="fa-brands fa-whatsapp"></i> WhatsApp</a
        >
      </p>
    </footer>

    <!-- Modal Admin -->
    <div class="modal" id="modal-admin">
      <div class="modal-content">
        <span class="close-btn" id="close-admin-modal">&times;</span>
        <h2 style="color: var(--primary-gold); margin-bottom: 1rem">
          Administración
        </h2>

        <div id="admin-login-sec">
          <div class="form-group">
            <label>Ingrese PIN de Administrador:</label>
            <input
              type="password"
              id="admin-pin"
              placeholder="Escribir PIN de seguridad"
            />
          </div>
          <button class="submit-btn" id="btn-verify-pin">Ingresar</button>
        </div>

        <div id="admin-panel-sec" style="display: none">
          <h3>Ajustes de la Tienda</h3>
          <div class="form-group">
            <label>Nombre de la Tienda:</label>
            <input type="text" id="input-store-title" />
          </div>
          <div class="form-group">
            <label>Subtítulo:</label>
            <input type="text" id="input-store-subtitle" />
          </div>
          <div class="form-group">
            <label>Número WhatsApp (Ej: 5492966123456):</label>
            <input type="text" id="input-store-ws" />
          </div>
          <div class="form-group">
            <label>Usuario Instagram (sin @):</label>
            <input type="text" id="input-store-ig" />
          </div>
          <button
            class="submit-btn"
            style="margin-bottom: 1.5rem"
            id="btn-save-settings"
          >
            Guardar Ajustes
          </button>

          <hr style="border-color: var(--border-gold); margin: 1.5rem 0" />

          <h3>Agregar Nuevo Producto</h3>
          <div class="form-group">
            <label>Nombre del Producto:</label>
            <input type="text" id="prod-name" />
          </div>
          <div class="form-group">
            <label>Categoría:</label>
            <select id="prod-category">
              <option value="Autos">Autos</option>
              <option value="Jabones">Jabones</option>
              <option value="Limpieza">Limpieza</option>
            </select>
          </div>
          <div class="form-group">
            <label>Precio ($):</label>
            <input type="number" id="prod-price" />
          </div>
          <div class="form-group">
            <label>URL Imagen:</label>
            <input
              type="text"
              id="prod-img"
              placeholder="https://ejemplo.com/imagen.jpg"
            />
          </div>
          <div class="form-group">
            <label>Descripción:</label>
            <textarea id="prod-desc" rows="3"></textarea>
          </div>
          <button class="submit-btn" id="btn-save-product">
            Guardar Producto
          </button>
        </div>
      </div>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('year').innerText = new Date().getFullYear();

        // Configuración de Supabase (Pega aquí tus claves si las usas)
        const SUPABASE_URL = 'https://TU-PROYECTO.supabase.co';
        const SUPABASE_ANON_KEY = 'TU-ANON-KEY-AQUI';

        let supabaseClient = null;
        if (
          typeof supabase !== 'undefined' &&
          SUPABASE_URL.includes('supabase.co') &&
          !SUPABASE_URL.includes('TU-PROYECTO')
        ) {
          try {
            supabaseClient = supabase.createClient(
              SUPABASE_URL,
              SUPABASE_ANON_KEY
            );
          } catch (e) {
            console.warn('Supabase no inicializado:', e);
          }
        }

        // Estado por defecto (PIN configurado en 200358)
        let settings = JSON.parse(localStorage.getItem('dg_settings')) || {
          title: 'Detail Gold',
          subtitle: 'Limpieza y Estética Automotriz',
          whatsapp: '5492966000000',
          instagram: 'detailgold',
          pin: '200358',
        };

        let products = JSON.parse(localStorage.getItem('dg_products')) || [
          {
            id: '1',
            name: 'Shampoo Neutro Concentrado',
            category: 'Jabones',
            price: 8500,
            image:
              'https://images.unsplash.com/photo-1607860108855-64acf2078ed9?auto=format&fit=crop&w=500&q=80',
            description:
              'Jabón especial con pH neutro para lavado de carrocería.',
          },
          {
            id: '2',
            name: 'Limpia Tapizados Multiuso',
            category: 'Limpieza',
            price: 6200,
            image:
              'https://images.unsplash.com/photo-1520340356584-f9917d1eea6f?auto=format&fit=crop&w=500&q=80',
            description: 'Elimina manchas difíciles en telas y cueros.',
          },
        ];

        let currentCategory = 'Todos';

        function updateUI() {
          document.getElementById('store-title').innerText = settings.title;
          document.getElementById('footer-title').innerText = settings.title;
          document.getElementById('doc-title').innerText = settings.title;
          document.getElementById('store-subtitle').innerText =
            settings.subtitle;
          document.getElementById(
            'link-instagram'
          ).href = `https://instagram.com/${settings.instagram}`;
          document.getElementById(
            'link-whatsapp'
          ).href = `https://wa.me/${settings.whatsapp}`;
        }

        function renderProducts() {
          const container = document.getElementById('products-container');
          const search = document
            .getElementById('search-input')
            .value.toLowerCase();

          container.innerHTML = '';

          const filtered = products.filter((p) => {
            const matchesCat =
              currentCategory === 'Todos' || p.category === currentCategory;
            const matchesSearch =
              p.name.toLowerCase().includes(search) ||
              (p.description && p.description.toLowerCase().includes(search));
            return matchesCat && matchesSearch;
          });

          if (filtered.length === 0) {
            container.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); padding: 2rem;">No hay productos para mostrar.</p>`;
            return;
          }

          filtered.forEach((p) => {
            const message = encodeURIComponent(
              `Hola! Quiero consultar por el producto: ${p.name} ($${p.price})`
            );
            const wsLink = `https://wa.me/${settings.whatsapp}?text=${message}`;

            container.innerHTML += `
            <div class="product-card">
              <img src="${p.image}" class="product-img" alt="${p.name}">
              <div class="product-info">
                <div class="product-title">${p.name}</div>
                <div class="product-desc">${p.description || ''}</div>
                <div class="product-price">$${Number(p.price).toLocaleString(
                  'es-AR'
                )}</div>
                <a href="${wsLink}" target="_blank" class="buy-btn">
                  <i class="fa-brands fa-whatsapp"></i> Consultar
                </a>
              </div>
            </div>
          `;
          });
        }

        // Event Listeners
        document
          .getElementById('btn-admin-modal')
          .addEventListener('click', () => {
            document.getElementById('modal-admin').classList.add('active');
          });

        document
          .getElementById('close-admin-modal')
          .addEventListener('click', () => {
            document.getElementById('modal-admin').classList.remove('active');
            document.getElementById('admin-pin').value = '';
          });

        document
          .getElementById('btn-verify-pin')
          .addEventListener('click', () => {
            const pinInput = document.getElementById('admin-pin').value;
            if (pinInput === settings.pin) {
              document.getElementById('admin-login-sec').style.display = 'none';
              document.getElementById('admin-panel-sec').style.display =
                'block';

              document.getElementById('input-store-title').value =
                settings.title;
              document.getElementById('input-store-subtitle').value =
                settings.subtitle;
              document.getElementById('input-store-ws').value =
                settings.whatsapp;
              document.getElementById('input-store-ig').value =
                settings.instagram;
            } else {
              alert('PIN incorrecto. El PIN de seguridad es incorrecto.');
            }
          });

        document
          .getElementById('btn-save-settings')
          .addEventListener('click', async () => {
            settings.title = document.getElementById('input-store-title').value;
            settings.subtitle = document.getElementById(
              'input-store-subtitle'
            ).value;
            settings.whatsapp = document.getElementById('input-store-ws').value;
            settings.instagram =
              document.getElementById('input-store-ig').value;

            localStorage.setItem('dg_settings', JSON.stringify(settings));

            if (supabaseClient) {
              await supabaseClient
                .from('store_settings')
                .update({
                  title: settings.title,
                  subtitle: settings.subtitle,
                  whatsapp: settings.whatsapp,
                  instagram: settings.instagram,
                  updated_at: new Date(),
                })
                .eq('id', 'default');
            }

            alert('¡Ajustes guardados correctamente!');
            updateUI();
            document.getElementById('modal-admin').classList.remove('active');
          });

        document
          .getElementById('btn-save-product')
          .addEventListener('click', async () => {
            const name = document.getElementById('prod-name').value;
            const category = document.getElementById('prod-category').value;
            const price = Number(document.getElementById('prod-price').value);
            const image = document.getElementById('prod-img').value;
            const description = document.getElementById('prod-desc').value;

            if (!name || !price || !image) {
              alert('Completa al menos el Nombre, Precio e Imagen.');
              return;
            }

            const newProd = {
              id: Date.now().toString(),
              name,
              category,
              price,
              image,
              description,
            };
            products.unshift(newProd);
            localStorage.setItem('dg_products', JSON.stringify(products));

            if (supabaseClient) {
              await supabaseClient
                .from('products')
                .insert([{ name, category, price, image, description }]);
            }

            alert('¡Producto guardado!');
            document.getElementById('prod-name').value = '';
            document.getElementById('prod-price').value = '';
            document.getElementById('prod-img').value = '';
            document.getElementById('prod-desc').value = '';

            renderProducts();
            document.getElementById('modal-admin').classList.remove('active');
          });

        document
          .getElementById('search-input')
          .addEventListener('input', renderProducts);

        document.querySelectorAll('.tag-btn').forEach((btn) => {
          btn.addEventListener('click', (e) => {
            document
              .querySelectorAll('.tag-btn')
              .forEach((b) => b.classList.remove('active'));
            e.target.classList.add('active');
            currentCategory = e.target.getAttribute('data-cat');
            renderProducts();
          });
        });

        async function syncSupabase() {
          if (supabaseClient) {
            const { data: sData } = await supabaseClient
              .from('store_settings')
              .select('*')
              .eq('id', 'default')
              .single();
            if (sData) {
              settings = sData;
              updateUI();
            }

            const { data: pData } = await supabaseClient
              .from('products')
              .select('*')
              .order('created_at', { ascending: false });
            if (pData && pData.length > 0) {
              products = pData;
              renderProducts();
            }
          }
        }

        updateUI();
        renderProducts();
        syncSupabase();
      });
    </script>
  </body>
</html>
